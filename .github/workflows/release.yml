name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [1.24.x]
        platform:
          - os: linux
            arch: amd64
            target: linux-amd64
          - os: linux
            arch: arm64
            target: linux-arm64
          - os: darwin
            arch: amd64
            target: darwin-amd64
          - os: darwin
            arch: arm64
            target: darwin-arm64
          - os: windows
            arch: amd64
            target: win-amd64
            ext: .exe

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build binary
      run: |
        GOOS=${{ matrix.platform.os }} GOARCH=${{ matrix.platform.arch }} go build -o polymarket-go-mcp${{ matrix.platform.ext || '' }} .
        mkdir -p dist
        mv polymarket-go-mcp${{ matrix.platform.ext || '' }} dist/polymarket-go-mcp-${{ matrix.platform.target }}${{ matrix.platform.ext || '' }}

    - name: Test binary
      run: |
        if [ "${{ matrix.platform.os }}" != "windows" ]; then
          chmod +x dist/polymarket-go-mcp-${{ matrix.platform.target }}${{ matrix.platform.ext || '' }}
          ./dist/polymarket-go-mcp-${{ matrix.platform.target }}${{ matrix.platform.ext || '' }} --help || true
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: polymarket-go-mcp-${{ matrix.platform.target }}
        path: dist/polymarket-go-mcp-${{ matrix.platform.target }}${{ matrix.platform.ext || '' }}
        retention-days: 1

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Display structure of downloaded files
      run: ls -R artifacts

    - name: Copy artifacts to dist directory
      run: |
        mkdir -p dist
        find artifacts -name "polymarket-go-mcp-*" -type f -exec cp {} dist/ \;
        ls -la dist/

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/polymarket-go-mcp-linux-amd64
          dist/polymarket-go-mcp-linux-arm64
          dist/polymarket-go-mcp-darwin-amd64
          dist/polymarket-go-mcp-darwin-arm64
          dist/polymarket-go-mcp-win-amd64.exe
        generate_release_notes: true
